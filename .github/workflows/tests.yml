name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended texlive-plain-generic latex-cjk-common
      - run: python -m pip install -r web/journal-engine/requirements-test.txt
      - run: python web/journal-engine/run_tests.py
      - run: npm ci
        working-directory: web
      - run: node standalone/build.mjs
        working-directory: web
      - run: node scripts/journal-http-acceptance.mjs
        working-directory: web
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm test
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python scripts/check-acceptance.py
  journal-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SHUYE_TEST_PDF: '1'
      SHUYE_FONTSET: fandol
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: node --test tests/journal-integrity.test.mjs
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - run: python scripts/journal-smoke.py output/journal-smoke
      - run: python scripts/journal-template-smoke.py output/journal-template-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: journal-smoke
          path: |
            output/journal-smoke
            output/journal-template-smoke
